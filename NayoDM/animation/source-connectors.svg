<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 316" role="img" aria-label="Diagram: Excel and CSV files are handed to NayoDM in one delivery, while IFS Cloud and IFS IEE stay connected and are read live; the records arrive ready to map with their columns detected" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  

  
  <text x="14" y="16" class="code" font-size="8.5" fill="#54446A">FILE · HANDED OVER ONCE</text>
  <text x="446" y="16" class="code" font-size="8.5" fill="#007F67" text-anchor="end">DIRECT CONNECTION · READ LIVE</text>

  
  <g class="code" font-size="9.5">
    <rect x="14" y="30" width="120" height="36" rx="2" fill="#F1EBF8" stroke="#CDBFE0"></rect>
    <text x="26" y="47" fill="#1E0B2E">Excel</text>
    <text x="26" y="59" font-size="8" fill="#54446A">from the business</text>

    <rect x="14" y="86" width="120" height="36" rx="2" fill="#F1EBF8" stroke="#CDBFE0"></rect>
    <text x="26" y="103" fill="#1E0B2E">CSV</text>
    <text x="26" y="115" font-size="8" fill="#54446A">exported file</text>
  </g>

  
  <g class="code" font-size="9.5">
    <rect x="326" y="30" width="120" height="36" rx="2" fill="#FFFFFF" stroke="#007F67" stroke-opacity="0.65"></rect>
    <text x="352" y="47" fill="#1E0B2E">IFS Cloud</text>
    <text x="352" y="59" font-size="8" fill="#007F67">connected</text>
    <circle class="beat" cx="340" cy="46" r="3" fill="none" stroke="#007F67"></circle>
    <circle class="dot" cx="340" cy="46" r="3" fill="#007F67"></circle>

    <rect x="326" y="86" width="120" height="36" rx="2" fill="#FFFFFF" stroke="#007F67" stroke-opacity="0.65"></rect>
    <text x="352" y="103" fill="#1E0B2E">IFS IEE</text>
    <text x="352" y="115" font-size="8" fill="#007F67">connected</text>
    <circle class="beat l2" cx="340" cy="102" r="3" fill="none" stroke="#007F67"></circle>
    <circle class="dot l2" cx="340" cy="102" r="3" fill="#007F67"></circle>
  </g>

  
  <g fill="none" stroke-width="1.4">
    <path d="M134 48 C 158 48 160 66 176 72" stroke="#CDBFE0"></path>
    <path d="M134 104 C 158 104 160 92 176 86" stroke="#CDBFE0"></path>
    <path class="link" d="M326 48 C 302 48 300 66 284 72" stroke="#007F67" stroke-opacity="0.8"></path>
    <path class="link l2" d="M326 104 C 302 104 300 92 284 86" stroke="#007F67" stroke-opacity="0.8"></path>
  </g>

  
  <circle class="drop" r="3" fill="#3A2C4E" style="offset-path:path('M134 48 C 158 48 160 66 176 72')"></circle>
  <circle class="drop d1" r="3" fill="#3A2C4E" style="offset-path:path('M134 104 C 158 104 160 92 176 86')"></circle>
  <g fill="#007F67">
    <circle class="live" r="2.6" style="offset-path:path('M326 48 C 302 48 300 66 284 72')"></circle>
    <circle class="live l2" r="2.6" style="offset-path:path('M326 48 C 302 48 300 66 284 72')"></circle>
    <circle class="live l3" r="2.6" style="offset-path:path('M326 48 C 302 48 300 66 284 72')"></circle>
    <circle class="live d1" r="2.6" style="offset-path:path('M326 104 C 302 104 300 92 284 86')"></circle>
    <circle class="live d2" r="2.6" style="offset-path:path('M326 104 C 302 104 300 92 284 86')"></circle>
    <circle class="live d3" r="2.6" style="offset-path:path('M326 104 C 302 104 300 92 284 86')"></circle>
  </g>

  
  <rect class="hub" x="176" y="52" width="108" height="52" rx="2" fill="#FFFFFF" stroke="#007F67"></rect>
  <text x="230" y="74" text-anchor="middle" font-size="11" fill="#1E0B2E" font-weight="600">NayoDM</text>
  <text x="230" y="90" text-anchor="middle" class="code" font-size="8" fill="#007F67">reading<tspan class="blink">_</tspan></text>

  
  <path class="link" d="M230 104 V 128" fill="none" stroke="#007F67" stroke-width="1.4"></path>
  <circle class="live d2" r="2.6" fill="#007F67" style="offset-path:path('M230 104 V 128')"></circle>

  
  <rect x="110" y="128" width="240" height="30" rx="2" fill="#F1EBF8" stroke="#CDBFE0"></rect>
  <text x="230" y="147" text-anchor="middle" class="code" font-size="9" fill="#1E0B2E">
    <tspan class="count" fill="#007F67">48 231</tspan> records ready to map
  </text>

  
  <text x="14" y="182" class="code" font-size="8.5" fill="#54446A">COLUMNS FOUND</text>
  <g class="code" font-size="8">
    <g class="settle">
      <rect x="14" y="190" width="94" height="18" fill="#FFFFFF" stroke="#CDBFE0"></rect>
      <text x="24" y="203" fill="#3A2C4E">CUSTOMER_NO</text>
    </g>
    <g class="settle d1">
      <rect x="116" y="190" width="94" height="18" fill="#FFFFFF" stroke="#CDBFE0"></rect>
      <text x="126" y="203" fill="#3A2C4E">NAME</text>
    </g>
    <g class="settle d2">
      <rect x="218" y="190" width="94" height="18" fill="#FFFFFF" stroke="#CDBFE0"></rect>
      <text x="228" y="203" fill="#3A2C4E">CREATED_DT</text>
    </g>
    <g class="settle d3">
      <rect x="320" y="190" width="126" height="18" fill="#FFFFFF" stroke="#CDBFE0"></rect>
      <text x="330" y="203" fill="#54446A">+ 26 more columns</text>
    </g>
  </g>

  
  <line x1="14" y1="230" x2="446" y2="230" stroke="#CDBFE0"></line>
  <g class="code" font-size="8.5">
    <text x="14" y="250" fill="#3A2C4E">Files</text>
    <text x="70" y="250" fill="#54446A">picked up as they are · sheet and first row chosen by you</text>
    <text x="14" y="270" fill="#007F67">Direct</text>
    <text x="70" y="270" fill="#54446A">read from the environment itself · no export, no staging file</text>
  </g>

  <rect x="14" y="288" width="432" height="3" fill="#F1EBF8"></rect>
  <rect class="fill-bar" x="14" y="288" width="432" height="3" fill="#007F67" fill-opacity="0.85"></rect>
  <text x="14" y="308" class="code" font-size="8" fill="#54446A">the steps after this point are the same for every source</text>
</svg>