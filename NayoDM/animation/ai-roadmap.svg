<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" role="img" aria-label="Diagram: five source fields flowing through an AI confidence engine into their IFS attributes, each field scored, with fields below the confidence threshold flagged for review" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  

