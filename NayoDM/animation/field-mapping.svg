<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 388" role="img" aria-label="Diagram: five legacy source columns routed through lookup, concatenate, date format, default and IFS-resolved rules into five IFS attributes, with the resulting expression and a worked row preview" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  

          <defs>
            <clipPath id="typeClip"><rect class="type" x="86" y="316" width="360" height="14"></rect></clipPath>
            <clipPath id="typeClip2"><rect class="type d2" x="86" y="334" width="360" height="14"></rect></clipPath>
          </defs>

          <text x="14" y="16" font-size="9" fill="#54446A" class="code">LEGACY COLUMN</text>
          <text x="230" y="16" font-size="9" fill="#54446A" class="code" text-anchor="middle">RULE</text>
          <text x="446" y="16" font-size="9" fill="#54446A" text-anchor="end" class="code">IFS ATTRIBUTE</text>

          <g class="code" font-size="9" fill="#1E0B2E">
            <rect x="14" y="26" width="112" height="24" fill="#F1EBF8" stroke="#CDBFE0"></rect><text x="24" y="41">PART_NO</text>
            <rect x="14" y="56" width="112" height="24" fill="#F1EBF8" stroke="#CDBFE0"></rect><text x="24" y="71">STREET</text>
            <rect x="14" y="86" width="112" height="24" fill="#F1EBF8" stroke="#CDBFE0"></rect><text x="24" y="101">CITY</text>
            <rect x="14" y="116" width="112" height="24" fill="#F1EBF8" stroke="#CDBFE0"></rect><text x="24" y="131">CREATED_DT</text>
            <rect x="14" y="146" width="112" height="24" fill="#F1EBF8" stroke="#CDBFE0"></rect><text x="24" y="161">CRD_LIMIT</text>
          </g>

          <g fill="none" stroke="#3F57E0" stroke-width="1.3" opacity="0.85">
            <path class="draw" d="M126 38 H 172"></path>
            <path class="draw d1" d="M126 68 C 148 68 150 80 172 80"></path>
            <path class="draw d1" d="M126 98 C 148 98 150 86 172 86"></path>
            <path class="draw d3" d="M126 128 H 172"></path>
            <path class="draw d4" d="M126 158 H 172"></path>
          </g>

          <g class="code" font-size="8">
            <rect x="172" y="26" width="112" height="24" fill="#FFFFFF" stroke="#3F57E0" stroke-opacity="0.7"></rect><text x="181" y="41" fill="#3F57E0">cross-reference</text>
            <rect x="172" y="68" width="112" height="24" fill="#FFFFFF" stroke="#3F57E0" stroke-opacity="0.7"></rect><text x="181" y="83" fill="#3F57E0">combine + trim</text>
            <rect x="172" y="116" width="112" height="24" fill="#FFFFFF" stroke="#3F57E0" stroke-opacity="0.7"></rect><text x="181" y="131" fill="#3F57E0">date format</text>
            <rect x="172" y="146" width="112" height="24" fill="#FFFFFF" stroke="#3F57E0" stroke-opacity="0.7"></rect><text x="181" y="161" fill="#3F57E0">default value</text>
            <rect x="172" y="182" width="112" height="24" fill="#FFFFFF" stroke="#A85F00" stroke-opacity="0.7"></rect><text x="181" y="197" fill="#A85F00">resolved by IFS</text>
          </g>

          <g fill="none" stroke="#007F67" stroke-width="1.3" opacity="0.9">
            <path class="draw d2" d="M284 38 H 330"></path>
            <path class="draw d3" d="M284 80 H 330"></path>
            <path class="draw d5" d="M284 128 H 330"></path>
            <path class="draw d5" d="M284 158 H 330"></path>
            <path class="draw d6" d="M284 194 H 330"></path>
          </g>

          <g fill="#007F67">
            <circle class="pkt" r="2.6" style="offset-path:path('M126 38 H 172')"></circle>
            <circle class="pkt d2" r="2.6" style="offset-path:path('M126 68 C 148 68 150 80 172 80')"></circle>
            <circle class="pkt d4" r="2.6" style="offset-path:path('M126 128 H 172')"></circle>
            <circle class="pkt d3" r="2.6" style="offset-path:path('M284 38 H 330')"></circle>
            <circle class="pkt d5" r="2.6" style="offset-path:path('M284 80 H 330')"></circle>
          </g>

          <g class="code" font-size="9" fill="#1E0B2E">
            <rect x="330" y="26" width="116" height="24" fill="#FFFFFF" stroke="#007F67" stroke-opacity="0.55"></rect><text x="340" y="41">CatalogNo</text>
            <rect x="330" y="68" width="116" height="24" fill="#FFFFFF" stroke="#007F67" stroke-opacity="0.55"></rect><text x="340" y="83">Address1</text>
            <rect x="330" y="116" width="116" height="24" fill="#FFFFFF" stroke="#007F67" stroke-opacity="0.55"></rect><text x="340" y="131">DateEntered</text>
            <rect x="330" y="146" width="116" height="24" fill="#FFFFFF" stroke="#007F67" stroke-opacity="0.55"></rect><text x="340" y="161">CreditLimit</text>
            <rect x="330" y="182" width="116" height="24" fill="#FFFFFF" stroke="#A85F00" stroke-opacity="0.55"></rect><text x="340" y="197">PartyType</text>
          </g>
          <text x="330" y="218" font-size="8" fill="#A85F00" class="code">warning — derived on import</text>

          <line x1="14" y1="238" x2="446" y2="238" stroke="#CDBFE0"></line>
          <text x="14" y="256" font-size="9" fill="#54446A" class="code">EXPRESSION — Address1</text>
          <rect x="14" y="264" width="432" height="40" fill="#F8F5FC" stroke="#CDBFE0"></rect>
          <text x="26" y="282" font-size="9" class="code" fill="#3F7A0A">trim(STREET) + &#34;, &#34; + CITY</text>
          <text x="26" y="296" font-size="9" class="code" fill="#3F7A0A">  truncated to 100 characters</text>

          <text x="14" y="326" font-size="8.5" fill="#54446A" class="code">ROW 00412</text>
          <g clip-path="url(#typeClip)">
            <text x="86" y="326" font-size="8.5" class="code" fill="#3A2C4E">STREET = &#34;12 Mill Rd &#34; , CITY = &#34;Leeds&#34;</text>
          </g>
          <g clip-path="url(#typeClip2)">
            <text x="86" y="344" font-size="8.5" class="code" fill="#007F67">Address1 = &#34;12 Mill Rd, Leeds&#34;</text>
          </g>
          <g class="pop d5">
            <rect x="330" y="333" width="62" height="14" fill="#FFFFFF" stroke="#007F67" stroke-opacity="0.6"></rect>
            <text x="337" y="343" font-size="8" class="code" fill="#007F67">validated</text>
          </g>

          <text x="14" y="370" font-size="8" fill="#54446A" class="code">28 attributes mapped</text>
          <text x="150" y="370" font-size="8" fill="#54446A" class="code">5 rules applied</text>
          <text x="234" y="370" font-size="8" fill="#A85F00" class="code">1 derived by IFS</text>
          <text x="350" y="370" font-size="8" fill="#007F67" class="code">0 unmapped</text>
        
</svg>