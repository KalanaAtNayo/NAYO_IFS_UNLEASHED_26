<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" role="img" aria-label="Diagram: a load of 1.24 million inventory balance rows moving into IFS a batch at a time, saved at checkpoints so an interrupted run continues from the last saved point, with live counts, rate and time remaining" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  

  <text x="14" y="14" class="code" font-size="8.5" fill="#54446A">LOAD</text>
  <text x="52" y="14" font-size="9.5" fill="#1E0B2E">Inventory balances · 1 240 000 rows</text>
  <text x="446" y="14" class="code" font-size="8.5" fill="#007F67" text-anchor="end">running unattended</text>
  <line x1="14" y1="22" x2="446" y2="22" stroke="#CDBFE0"></line>

  
  <text x="14" y="42" class="code" font-size="8.5" fill="#54446A">A BATCH AT A TIME</text>

  <rect x="14" y="52" width="86" height="58" rx="2" fill="#FFFFFF" stroke="#CDBFE0"></rect>
  <text x="57" y="72" text-anchor="middle" font-size="9" fill="#1E0B2E">source</text>
  <text x="57" y="86" text-anchor="middle" class="code" font-size="8" fill="#54446A">1 240 000</text>
  <text x="57" y="99" text-anchor="middle" class="code" font-size="8" fill="#54446A">rows waiting</text>

  <path class="link" d="M100 81 H 352" fill="none" stroke="#3F57E0" stroke-width="1.2" stroke-opacity="0.7"></path>

  <g fill="#007F67">
    <rect class="batch" x="-9" y="-4" width="18" height="8" rx="1" style="offset-path:path('M100 81 H 352')"></rect>
    <rect class="batch b2" x="-9" y="-4" width="18" height="8" rx="1" style="offset-path:path('M100 81 H 352')"></rect>
    <rect class="batch b3" x="-9" y="-4" width="18" height="8" rx="1" style="offset-path:path('M100 81 H 352')"></rect>
    <rect class="batch b4" x="-9" y="-4" width="18" height="8" rx="1" style="offset-path:path('M100 81 H 352')"></rect>
  </g>
  <text x="226" y="104" text-anchor="middle" class="code" font-size="8" fill="#54446A">1 000 rows in each batch · nothing is held in memory</text>

  
  <ellipse cx="400" cy="56" rx="46" ry="11" fill="#007F67" fill-opacity="0.16" stroke="#007F67"></ellipse>
  <path class="accept" d="M354 56 V 100 C 354 107 375 112 400 112 C 425 112 446 107 446 100 V 56" fill="#007F67" fill-opacity="0.07" stroke="#007F67"></path>
  <ellipse cx="400" cy="100" rx="46" ry="11" fill="none" stroke="#007F67" stroke-opacity="0.45"></ellipse>
  <text x="400" y="84" text-anchor="middle" font-size="10" fill="#1E0B2E">IFS Cloud</text>

  
  <line x1="14" y1="130" x2="446" y2="130" stroke="#CDBFE0"></line>
  <text x="14" y="150" class="code" font-size="8.5" fill="#54446A">SAVED AS IT GOES</text>
  <text x="446" y="150" class="code" font-size="8" fill="#54446A" text-anchor="end">a stopped run picks up from the last save</text>

  <rect x="14" y="170" width="432" height="4" rx="2" fill="#F1EBF8"></rect>
  <rect class="track" x="14" y="170" width="432" height="4" rx="2" fill="#007F67" fill-opacity="0.8"></rect>

  <g fill="#007F67">
    <circle class="save" cx="86" cy="172" r="4"></circle>
    <circle class="save k2" cx="158" cy="172" r="4"></circle>
    <circle class="save k3" cx="230" cy="172" r="4"></circle>
    <circle class="save k4" cx="302" cy="172" r="4"></circle>
    <circle class="save k5" cx="374" cy="172" r="4"></circle>
  </g>
  <g class="code" font-size="8" fill="#54446A">
    <text x="86" y="190" text-anchor="middle">50 000</text>
    <text x="158" y="190" text-anchor="middle">100 000</text>
    <text x="230" y="190" text-anchor="middle">150 000</text>
    <text x="302" y="190" text-anchor="middle">200 000</text>
    <text x="374" y="190" text-anchor="middle" fill="#007F67">last save</text>
  </g>

  
  <line x1="14" y1="208" x2="446" y2="208" stroke="#CDBFE0"></line>
  <text x="14" y="228" class="code" font-size="8.5" fill="#54446A">WHILE IT RUNS</text>

  <g class="count">
    <rect x="14" y="238" width="103" height="40" fill="#FFFFFF" stroke="#CDBFE0"></rect>
    <text x="24" y="253" class="code" font-size="8" fill="#54446A">LOADED</text>
    <text x="24" y="269" font-size="13" font-weight="600" fill="#007F67">1 180 000</text>
  </g>
  <g class="count k2">
    <rect x="124" y="238" width="103" height="40" fill="#FFFFFF" stroke="#CDBFE0"></rect>
    <text x="134" y="253" class="code" font-size="8" fill="#54446A">REMAINING</text>
    <text x="134" y="269" font-size="13" font-weight="600" fill="#1E0B2E">60 000</text>
  </g>
  <g class="count k3">
    <rect x="234" y="238" width="103" height="40" fill="#FFFFFF" stroke="#CDBFE0"></rect>
    <text x="244" y="253" class="code" font-size="8" fill="#54446A">RATE</text>
    <text x="244" y="269" font-size="13" font-weight="600" fill="#1E0B2E">4.6 MB/s</text>
  </g>
  <g class="count k4">
    <rect x="344" y="238" width="102" height="40" fill="#FFFFFF" stroke="#CDBFE0"></rect>
    <text x="354" y="253" class="code" font-size="8" fill="#54446A">TIME LEFT</text>
    <text x="354" y="269" font-size="13" font-weight="600" fill="#1E0B2E">00:41</text>
  </g>

  <g class="code" font-size="8" fill="#54446A">
    <text x="14" y="300">every record's outcome is written to the run log</text>
    <text x="446" y="300" text-anchor="end" fill="#007F67">95% complete<tspan class="blink">_</tspan></text>
    <text x="14" y="320">the team carries on with other work while this runs</text>
  </g>
</svg>