<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 402" role="img" aria-label="Diagram: pre-flight runs two passes - row rules check every record for required, format and length, then basic data validation checks each distinct referenced value against IFS, reporting values that do not exist yet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  

  <text x="14" y="14" class="code" font-size="8.5" fill="#54446A">PRE-FLIGHT</text>
  <text x="446" y="14" class="code" font-size="8.5" fill="#007F67" text-anchor="end">148 320 rows · two passes</text>
  <line x1="14" y1="22" x2="446" y2="22" stroke="#CDBFE0"></line>

  
  <rect class="stage" x="14" y="32" width="432" height="118" fill="none" stroke="#3F57E0" stroke-opacity="0.35"></rect>
  <text x="24" y="48" class="code" font-size="8.5" fill="#1E0B2E">PASS 1 · ROW RULES</text>
  <text x="436" y="48" class="code" font-size="8" fill="#54446A" text-anchor="end">every record, every mapped field</text>

  <g class="code" font-size="8" fill="#54446A">
    <text x="24" y="66">ROW</text><text x="86" y="66">FIELD</text><text x="212" y="66">RULE</text><text x="330" y="66">RESULT</text>
  </g>

  <g class="code" font-size="9">
    <rect x="24" y="72" width="412" height="17" fill="#FFFFFF"></rect>
    <text x="30" y="84" fill="#54446A">00412</text><text x="86" y="84" fill="#3A2C4E">CUSTOMER_NO</text>
    <text x="212" y="84" fill="#54446A">required</text><text class="pop" x="330" y="84" fill="#007F67">pass</text>

    <rect x="24" y="91" width="412" height="17" fill="#FFFFFF"></rect>
    <text x="30" y="103" fill="#54446A">00413</text><text x="86" y="103" fill="#3A2C4E">DATE_ENTERED</text>
    <text x="212" y="103" fill="#54446A">date format</text><text class="pop d1" x="330" y="103" fill="#007F67">pass</text>

    <rect x="24" y="110" width="412" height="17" fill="#F1EBF8"></rect>
    <text x="30" y="122" fill="#54446A">00414</text><text x="86" y="122" fill="#A85F00">PARTY_TYPE</text>
    <text x="212" y="122" fill="#54446A">derived on import</text><text class="pop d2" x="330" y="122" fill="#A85F00">warning</text>

    <rect x="24" y="129" width="412" height="17" fill="#FFFFFF"></rect>
    <text x="30" y="141" fill="#54446A">00415</text><text x="86" y="141" fill="#3A2C4E">ADDRESS1</text>
    <text x="212" y="141" fill="#54446A">max length 100</text><text class="pop d3" x="330" y="141" fill="#007F67">pass</text>
  </g>

  <g class="scan">
    <rect x="24" y="72" width="412" height="18" fill="#007F67" fill-opacity="0.06"></rect>
    <rect x="24" y="89" width="412" height="1.2" fill="#007F67" fill-opacity="0.5"></rect>
  </g>

  
  <rect class="stage s2" x="14" y="164" width="432" height="122" fill="none" stroke="#007F67" stroke-opacity="0.35"></rect>
  <text x="24" y="180" class="code" font-size="8.5" fill="#1E0B2E">PASS 2 · BASIC DATA</text>
  <text x="436" y="180" class="code" font-size="8" fill="#54446A" text-anchor="end">does the value exist in IFS yet?</text>

  <g class="code" font-size="8" fill="#54446A">
    <text x="24" y="198">FIELD</text><text x="128" y="198">DISTINCT</text><text x="186" y="198">RESULT</text>
  </g>

  <g class="code" font-size="9">
    <text x="24" y="216" fill="#3A2C4E">COUNTRY_CODE</text>
    <text x="128" y="216" fill="#54446A">42</text>
    <text class="pop d1" x="186" y="216" fill="#007F67">all found</text>

    <text x="24" y="234" fill="#3A2C4E">DELIVERY_TERM</text>
    <text x="128" y="234" fill="#54446A">18</text>
    <text class="pop d3" x="186" y="234" fill="#A85F00">2 missing</text>

    <text x="24" y="252" fill="#3A2C4E">UNIT_OF_MEASURE</text>
    <text x="128" y="252" fill="#54446A">9</text>
    <text class="pop d4" x="186" y="252" fill="#007F67">all found</text>

    <text x="24" y="270" fill="#3A2C4E">CUSTOMER_GROUP</text>
    <text x="128" y="270" fill="#54446A">6</text>
    <text class="pop d5" x="186" y="270" fill="#A85F00">1 missing</text>
  </g>

  
  <rect x="300" y="204" width="140" height="72" rx="2" fill="#FFFFFF" stroke="#007F67" stroke-opacity="0.55"></rect>
  <text x="370" y="222" text-anchor="middle" font-size="9.5" fill="#1E0B2E">IFS basic data</text>
  <g class="code" font-size="8" fill="#54446A">
    <text x="312" y="240">country codes</text>
    <text x="312" y="254">delivery terms</text>
    <text x="312" y="268">units, groups, terms</text>
  </g>

  
  <g fill="none" stroke="#007F67" stroke-width="1.2" stroke-opacity="0.5">
    <path class="link" d="M258 212 C 282 212 284 222 300 226"></path>
    <path class="link" d="M258 266 C 282 266 284 254 300 250"></path>
  </g>
  <g fill="#007F67">
    <circle class="lookup d1" r="2.4" style="offset-path:path('M258 212 C 282 212 284 222 300 226')"></circle>
    <circle class="lookup d4" r="2.4" style="offset-path:path('M258 266 C 282 266 284 254 300 250')"></circle>
  </g>

  
  <line x1="14" y1="300" x2="446" y2="300" stroke="#CDBFE0"></line>
  <text x="14" y="318" class="code" font-size="8.5" fill="#54446A">OUTCOME</text>

  <g class="count">
    <rect x="14" y="326" width="136" height="38" fill="#FFFFFF" stroke="#007F67" stroke-opacity="0.5"></rect>
    <text x="24" y="341" class="code" font-size="8" fill="#54446A">ROWS READY</text>
    <text x="24" y="356" font-size="14" font-weight="600" fill="#007F67">148 317</text>
  </g>
  <g class="count d2">
    <rect x="162" y="326" width="136" height="38" fill="#FFFFFF" stroke="#A85F00" stroke-opacity="0.5"></rect>
    <text x="172" y="341" class="code" font-size="8" fill="#54446A">BASIC DATA TO ADD</text>
    <text x="172" y="356" font-size="14" font-weight="600" fill="#A85F00">3</text>
  </g>
  <g class="count d4">
    <rect x="310" y="326" width="136" height="38" fill="#FFFFFF" stroke="#C8341B" stroke-opacity="0.5"></rect>
    <text x="320" y="341" class="code" font-size="8" fill="#54446A">ROWS TO FIX</text>
    <text x="320" y="356" font-size="14" font-weight="600" fill="#C8341B">3</text>
  </g>

  <rect x="14" y="376" width="432" height="3" fill="#F1EBF8"></rect>
  <rect class="fill-bar" x="14" y="376" width="432" height="3" fill="#007F67" fill-opacity="0.85"></rect>
  <g class="code" font-size="8">
    <text x="14" y="396" fill="#54446A">to create in IFS first:</text>
    <text x="130" y="396" fill="#A85F00">DDU-WHSE, LEGACY-04, RETAIL-EU</text>
    <text x="446" y="396" fill="#54446A" text-anchor="end">nothing is written until both passes are clear</text>
  </g>
</svg>