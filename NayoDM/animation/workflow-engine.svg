<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 358" role="img" aria-label="Diagram: a workflow correcting delivery terms on 3412 open order lines - records selected, backed up, matched against a reference, updated in IFS and verified, with 3180 updated, 232 flagged for review and none failed" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  

  
  <text x="14" y="14" class="code" font-size="8.5" fill="#54446A">JOB</text>
  <text x="52" y="14" font-size="9.5" fill="#1E0B2E">Correct delivery terms on open order lines</text>
  <text x="446" y="14" class="code" font-size="8.5" fill="#54446A" text-anchor="end">after the order load</text>
  <line x1="14" y1="22" x2="446" y2="22" stroke="#CDBFE0"></line>

  
  <text x="14" y="40" class="code" font-size="8.5" fill="#54446A">SELECTED RECORDS</text>
  <text x="446" y="40" class="code" font-size="8.5" fill="#007F67" text-anchor="end">3 412 lines</text>

  <g class="code" font-size="8">
    <text x="14" y="56" fill="#54446A">ORDER</text>
    <text x="86" y="56" fill="#54446A">LINE</text>
    <text x="132" y="56" fill="#54446A">LEGACY TERM</text>
    <text x="256" y="56" fill="#54446A">IFS DELIVERY TERM</text>

    <rect x="14" y="62" width="432" height="16" fill="#FFFFFF"></rect>
    <text x="14" y="73" fill="#3A2C4E">CO-100412</text>
    <text x="86" y="73" fill="#3A2C4E">10</text>
    <text x="132" y="73" fill="#3A2C4E">DDU-WHSE</text>
    <text x="222" y="73" fill="#54446A">→</text>
    <text class="pop d1" x="256" y="73" fill="#007F67">DAP</text>

    <rect x="14" y="80" width="432" height="16" fill="#FFFFFF"></rect>
    <text x="14" y="91" fill="#3A2C4E">CO-100412</text>
    <text x="86" y="91" fill="#3A2C4E">20</text>
    <text x="132" y="91" fill="#3A2C4E">EXW-PLANT2</text>
    <text x="222" y="91" fill="#54446A">→</text>
    <text class="pop d2" x="256" y="91" fill="#007F67">EXW</text>

    <rect x="14" y="98" width="432" height="16" fill="#F1EBF8"></rect>
    <text x="14" y="109" fill="#3A2C4E">CO-100587</text>
    <text x="86" y="109" fill="#3A2C4E">30</text>
    <text x="132" y="109" fill="#A85F00">LEGACY-04</text>
    <text x="222" y="109" fill="#54446A">→</text>
    <text class="pop d3" x="256" y="109" fill="#A85F00">no match · flagged</text>

    <text x="14" y="128" fill="#54446A">+ 3 409 more lines in this run</text>
  </g>

  
  <line x1="14" y1="142" x2="446" y2="142" stroke="#CDBFE0"></line>
  <text x="14" y="160" class="code" font-size="8.5" fill="#54446A">STEPS</text>

  <g fill="none" stroke="#3F57E0" stroke-width="1.4">
    <path class="flow" d="M110 190 H 130"></path>
    <path class="flow d2" d="M222 190 H 242"></path>
    <path class="flow d4" d="M334 190 H 354"></path>
  </g>
  <g fill="#007F67">
    <circle class="pkt" r="2.8" style="offset-path:path('M110 190 H 130')"></circle>
    <circle class="pkt d3" r="2.8" style="offset-path:path('M222 190 H 242')"></circle>
    <circle class="pkt d5" r="2.8" style="offset-path:path('M334 190 H 354')"></circle>
  </g>

  <g class="code" font-size="8.5">
    <rect class="visit" x="14" y="170" width="96" height="40" fill="#007F67" fill-opacity="0.12" stroke="#007F67"></rect>
    <text x="24" y="186" fill="#1E0B2E">1 · back up</text>
    <text x="24" y="200" fill="#3A2C4E" font-size="8">3 412 lines saved</text>

    <rect class="visit v2" x="130" y="170" width="92" height="40" fill="#3F57E0" fill-opacity="0.12" stroke="#3F57E0"></rect>
    <text x="140" y="186" fill="#1E0B2E">2 · match</text>
    <text x="140" y="200" fill="#3A2C4E" font-size="8">term reference</text>

    <rect class="visit v3" x="242" y="170" width="92" height="40" fill="#3F57E0" fill-opacity="0.12" stroke="#3F57E0"></rect>
    <text x="252" y="186" fill="#1E0B2E">3 · update</text>
    <text x="252" y="200" fill="#3A2C4E" font-size="8">in IFS, batched</text>

    <rect class="visit v4" x="354" y="170" width="92" height="40" fill="#3F7A0A" fill-opacity="0.12" stroke="#3F7A0A"></rect>
    <text x="364" y="186" fill="#1E0B2E">4 · verify</text>
    <text x="364" y="200" fill="#3A2C4E" font-size="8">re-read + count</text>
  </g>

  
  <path class="draw d3" d="M176 210 V 232 H 246" fill="none" stroke="#A85F00" stroke-width="1.3"></path>
  <text x="186" y="228" class="code" font-size="8" fill="#A85F00">no match</text>
  <rect x="246" y="222" width="120" height="20" fill="#FFFFFF" stroke="#A85F00" stroke-opacity="0.6"></rect>
  <text x="256" y="236" class="code" font-size="8" fill="#A85F00">held for review, not written</text>

  
  <line x1="14" y1="258" x2="446" y2="258" stroke="#CDBFE0"></line>
  <text x="14" y="276" class="code" font-size="8.5" fill="#54446A">OUTCOME</text>

  <g class="count">
    <rect x="14" y="284" width="136" height="38" fill="#FFFFFF" stroke="#007F67" stroke-opacity="0.5"></rect>
    <text x="24" y="299" class="code" font-size="8" fill="#54446A">UPDATED</text>
    <text x="24" y="314" font-size="14" font-weight="600" fill="#007F67">3 180</text>
  </g>
  <g class="count d2">
    <rect x="162" y="284" width="136" height="38" fill="#FFFFFF" stroke="#A85F00" stroke-opacity="0.5"></rect>
    <text x="172" y="299" class="code" font-size="8" fill="#54446A">HELD FOR REVIEW</text>
    <text x="172" y="314" font-size="14" font-weight="600" fill="#A85F00">232</text>
  </g>
  <g class="count d4">
    <rect x="310" y="284" width="136" height="38" fill="#FFFFFF" stroke="#CDBFE0"></rect>
    <text x="320" y="299" class="code" font-size="8" fill="#54446A">FAILED</text>
    <text x="320" y="314" font-size="14" font-weight="600" fill="#1E0B2E">0</text>
  </g>

  <rect x="14" y="332" width="432" height="3" fill="#F1EBF8"></rect>
  <rect class="fill-bar" x="14" y="332" width="432" height="3" fill="#007F67" fill-opacity="0.85"></rect>
  <g class="code" font-size="8" fill="#54446A">
    <text x="14" y="350">running in the background</text>
    <text x="176" y="350">reversible from the backup</text>
    <text x="340" y="350" fill="#007F67">re-runnable per environment<tspan class="blink">_</tspan></text>
  </g>
</svg>